<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nouveau mot de passe - Into The Mist</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="icon"
        href="https://res.cloudinary.com/dd4rdtrig/image/upload/v1765754698/ffxiv_logo_black_text_patch_7.0_pgijf1.png"
        type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=2.1">
</head>

<body>
    <div class="banner-container">
        <div class="logo-circle logo-center">
            <img id="main-logo"
                src="https://res.cloudinary.com/dd4rdtrig/image/upload/v1765754698/ffxiv_logo_black_text_patch_7.0_pgijf1.png"
                alt="Logo" style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover;">
        </div>
    </div>

    <button id="audio-toggle" class="audio-btn" aria-label="Toggle Music"><span id="audio-icon">🔇</span></button>
    <button id="theme-toggle" class="theme-btn" aria-label="Toggle Theme"><span id="theme-icon">🌙</span></button>

    <main>
        <div id="login-view">
            <div class="auth-container">
                <div class="auth-header">
                    <h2>Nouveau mot de passe</h2>
                </div>
                <form id="reset-form">
                    <div class="form-group">
                        <label>Nouveau mot de passe</label>
                        <input type="password" id="password" placeholder="Mot de passe" class="form-input"
                            autocomplete="new-password" required>
                    </div>
                    <div class="form-group">
                        <label>Confirmez le mot de passe</label>
                        <input type="password" id="password-confirm" placeholder="Confirmation" class="form-input"
                            autocomplete="new-password" required>
                    </div>
                    <button type="submit" class="btn-primary" id="submit-btn">Réinitialiser</button>
                    <p id="form-msg" class="form-msg" style="display: none;"></p>
                </form>
                <div class="auth-links">
                    <a href="index.html">Retour à la connexion</a>
                </div>
            </div>
        </div>
    </main>

    <script type="module" src="/src/js/pages/reset-password.js"></script>
</body>

</html>
